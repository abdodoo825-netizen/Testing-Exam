<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f6;--surface:#fff;--ink:#16213a;--mut:#5d6882;--line:#d7ddea;
  --ac:#1d4ed8;--ac-soft:#e6edff;--warn:#b45309;--warn-soft:#fff3e0;--bad:#b42318;--ok:#067647;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1524;--surface:#18203a;--ink:#eef1fa;--mut:#9aa6c4;--line:#2d3858;--ac:#7aa2ff;--ac-soft:#1f2c55;--warn:#fbbf24;--warn-soft:#3a2d12;--bad:#ff8a7a;--ok:#4ade80}}
:root[data-theme="dark"]{--bg:#0f1524;--surface:#18203a;--ink:#eef1fa;--mut:#9aa6c4;--line:#2d3858;--ac:#7aa2ff;--ac-soft:#1f2c55;--warn:#fbbf24;--warn-soft:#3a2d12;--bad:#ff8a7a;--ok:#4ade80}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;min-height:100vh}
input,textarea{-webkit-user-select:text;user-select:text}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 96px}
h1,h2{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px}
.intro h1{font-size:32px;line-height:1.2;margin-bottom:6px}
.intro .sub{color:var(--mut);margin:0 0 22px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.fact{background:var(--bg);border-radius:12px;padding:14px 16px}
.fact b{display:block;font-family:var(--serif);font-size:26px;line-height:1.1}
.fact span{color:var(--mut);font-size:14px}
.rules{margin:0 0 24px;padding:0;list-style:none;display:grid;gap:10px}
.rules li{padding-left:26px;position:relative;font-size:15px}
.rules li::before{content:"";position:absolute;left:0;top:.55em;width:10px;height:10px;border-radius:50%;background:var(--line)}
.rules li.hard::before{background:var(--bad)}
label.f{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input[type=text]{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:var(--bg);color:var(--ink);outline:none}
input[type=text]:focus{border-color:var(--ac)}
.btn{font:inherit;font-weight:600;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:14px 26px;cursor:pointer;transition:transform .08s}
:root[data-theme="dark"] .btn,.dk .btn{color:#0b1226}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0b1226}}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent!important;color:var(--ink)!important;border:1.5px solid var(--line)}
.btn.full{width:100%;margin-top:16px}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.err{color:var(--bad);font-size:14px;margin:6px 0 0;min-height:1.2em}

/* exam */
.head{position:sticky;top:0;background:var(--bg);padding:12px 0 10px;z-index:3}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.who{font-size:14px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer{font-variant-numeric:tabular-nums;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:15px}
.timer.low{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.dots{display:flex;gap:5px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dots i.done{background:var(--ac)}
.dots i.cur{background:var(--ink)}
.qn{color:var(--mut);font-size:14px;margin:22px 0 8px}
.q{font-size:22px;line-height:1.4;margin-bottom:22px;white-space:pre-line}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface);
  border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .12s,background .12s}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:14px;color:var(--mut)}
.opt.sel{border-color:var(--ac);background:var(--ac-soft)}
.opt.sel .k{background:var(--ac);border-color:var(--ac);color:#fff}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:3}
.bottom .in{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.bottom .hint{color:var(--mut);font-size:14px}
.end{text-align:center;padding:44px 24px}
.end .ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;font-size:26px;background:var(--ac-soft)}
.end.bad .ic{background:var(--warn-soft)}
.end h2{font-size:26px;margin-bottom:8px}
.end p{color:var(--mut);margin:0}

.tag{font-size:13px;font-weight:600;color:var(--ac);background:var(--ac-soft);border-radius:999px;padding:4px 12px}
.hintp{color:var(--mut);font-size:14px;margin:-10px 0 18px}
.fl{display:block;font-weight:600;font-size:14px;margin:16px 0 6px}
.ans{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:var(--surface);color:var(--ink);outline:none;resize:vertical;line-height:1.5}
.ans:focus{border-color:var(--ac)}
textarea.ans{min-height:140px}
textarea.ans.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;min-height:220px;white-space:pre;overflow:auto}
.end .btn{margin-top:22px}

.ans.medium{min-height:90px}
.ans.xl{min-height:240px}
textarea.ans.codesm{min-height:130px}
.ans.codesm{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;white-space:pre;overflow:auto}
.sec{font-family:var(--serif);font-size:18px;margin:28px 0 4px;padding-top:16px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0;margin-top:0;padding-top:0}
.shotwrap{margin:0 0 8px}
.shot{display:block;width:100%;max-width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;pointer-events:auto;cursor:zoom-in;-webkit-user-drag:none}
.zoomhint{color:var(--mut);font-size:13px;margin:6px 0 0}
#lb{position:fixed;inset:0;z-index:8;background:rgba(10,14,25,.92);overflow:auto;-webkit-overflow-scrolling:touch}
#lb img{display:block;width:100%;min-width:900px;background:#fff;margin:56px 0 24px;-webkit-user-drag:none}
#lb button{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:14px;z-index:9}
.tbl{border:1.5px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;margin-top:6px}
.trow{padding:14px 14px 16px;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow .rl{font-weight:600;font-size:14px;color:var(--ac);margin-bottom:8px}
.trow .cl{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.trow .ans{background:var(--bg)}

.ap{margin:10px 0}
.ah{font-family:var(--serif);font-size:18px;margin:22px 0 6px}
ul.ab{margin:8px 0 8px;padding-left:20px}
.ab li{margin:8px 0}
.after{margin:14px 0 6px}
.mini{font:inherit;font-weight:600;font-size:14px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer}
.mini.on{background:var(--ac);color:var(--surface);border-color:var(--ac)}
.mini.x{padding:8px 0;width:36px;color:var(--mut)}
.mini.add{margin-top:10px;color:var(--ac)}
.mini.big{width:100%;margin-top:4px}
.mini.sw{width:34px;height:34px;padding:0;border-radius:50%}
.dbd{border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:12px;margin-top:6px}
.dbd .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--bg)}
.thead{display:grid;grid-template-columns:1fr 36px;gap:6px;margin-bottom:6px}
.crow{display:grid;grid-template-columns:1fr 62px 36px;gap:6px;margin-top:8px}
.crow .ref{grid-column:1 / -1;font-size:14px;padding:10px 12px}
.dbd .ans{background:var(--surface);padding:11px 12px}
.rh{font-weight:600;font-size:14px;margin:16px 0 4px}
.rrow{display:grid;grid-template-columns:1fr 36px;gap:6px;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.rrow .rel{grid-column:1 / 2;text-align:center}
.tb{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.cvw{position:relative}
.cv{display:block;width:100%;height:auto;border:1.5px solid var(--line);border-radius:12px;background:#fff;touch-action:none;cursor:crosshair}
.cvw .ti{position:absolute;z-index:2;width:200px;padding:6px 8px;border:1.5px solid var(--ac);border-radius:8px;font:inherit;background:#fff;color:#111}
#shield{position:fixed;inset:0;background:var(--bg);z-index:9;display:none}
@media (max-width:480px){.panel{padding:20px}.q{font-size:20px}.intro h1{font-size:27px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{body{display:none!important}}
</style>
</head>
<body>
<div id="shield"></div>
<div class="wrap" id="app"></div>
<script>
/* ============ SETTINGS — edit here ============ */
const EXAM_TITLE = "Software Testing Exam";
const SUBTITLE   = "Multiple choice and practical questions";
const SHEET_URL  = "https://script.google.com/macros/s/AKfycbwZDeT70gEBPM2oodwp0JAbMO0_Cfvgid7dgbNqeqmXomp1vSdbWHQOgL2p8H3a9NtC/exec";
const MINUTES    = 0;    // 0 = no time limit
// Correct answers are NOT stored here. Put them in Code.gs (ANSWER_KEY).
const QUESTIONS = [
  {q:"What is the purpose of software testing?", o:["To ensure 100% bug-free software", "To verify that the software meets requirements and specifications", "To develop new features in the software", "To speed up the software development process"]},
  {q:"A developer fixes a bug related to the payment calculation. What should the tester do first after receiving the new build?", o:["Execute the entire regression suite", "Retest the failed scenario", "Test an unrelated module", "Start performance testing"]},
  {q:"Which of the following test levels is MOST likely being performed if the testing is focused on validation and is not being performed by testers?", o:["Component integration testing", "System integration testing", "Component testing", "Acceptance testing"]},
  {q:"What is the main objective of smoke testing?", o:["To ensure that all functionalities work as expected", "To validate the software against non-functional requirements", "To verify that the critical functionalities of the software are working", "To assess the performance of the software under load"]},
  {q:"When coding is directed by the test cases, what development approach is being used?", o:["TBD", "BDD", "TDD", "ATDD"]},
  {q:"The requirement says: “Users can withdraw an amount between $100 and $500.” Which set of test values provides the best boundary coverage?", o:["100, 200, 300, 400, 500", "99, 100, 101, 499, 500, 501", "50, 150, 250, 350, 450", "100 and 500 only"]},
  {q:"You work as a tester on a project involving a mobile application for supermarket shopping. The client sent you a list of requirements. One of them, with high priority, says:\n“The order must be processed in less than 10 seconds in 95% of the cases.”\nYou created a set of test cases in which a number of random orders were made, the processing time was measured, and the test results were checked against the requirement.\nWhat type of testing did you perform?", o:["Functional, because the test cases cover the user's business requirement for the system", "Non-functional, because they measure the system's performance", "Functional, because the test cases interact with the user interface", "White box, because we need to know the internal structure of the program to measure the order processing"]},
  {q:"A tester executes the same test cases repeatedly and finds no new defects. What should the tester consider?", o:["Stop testing completely", "Use different testing approaches and test data", "The application is defect-free", "Remove all existing test cases"]},
  {q:"What is the primary objective of exploratory testing?", o:["To follow predefined test cases", "To find defects by exploring the software", "To automate test execution", "To perform load testing"]},
  {q:"The ideal defect state flow can be:", o:["Open → In Testing → Fixed → Closed", "Open → Closed → Open", "In Testing → Open → Closed", "Fixed → Closed → In Testing"]},
  {q:"You have been testing software that will be used to track credit card purchases. You have found a defect that causes the system to crash, but only if a person has made and voided 10 purchases in a row.\nWhat is the proper priority and severity rating for this defect?", o:["Priority high, severity high", "Priority high, severity low", "Priority low, severity low", "Priority low, severity high"]},
  {q:"Which SQL JOIN returns all rows from both tables, joining records where available?", o:["INNER JOIN", "LEFT JOIN", "RIGHT JOIN", "FULL OUTER JOIN"]},
  {q:"A tester is validating a banking application. The tester wants to find all customers who have an account balance greater than 10,000 and display their customer ID, name, and balance from the Customers table.\nWhich SQL clause should the tester use to filter the records based on the account balance?", o:["ORDER BY", "GROUP BY", "WHERE", "JOIN"]},
  {q:"What is Selenium WebDriver mainly used for?", o:["Database testing", "Performance monitoring", "Automating web browsers", "API development"]},
  {q:"You have 100 test cases but only 30 minutes before release. What is the best strategy?", o:["Execute the first 30 test cases alphabetically", "Execute the highest risk and business-critical scenarios first", "Execute only positive test cases", "Randomly select 30"]}
];

// ----- Practical (written) questions: shown after the MCQ part -----
// type: "short" (one line) | "medium" | "long" | "xl" (text boxes of growing size) | "code" / "codesm" (monospace boxes)
//       "fields" (several labelled boxes) -> fields:["Title", {l:"Steps",t:"medium"}, {h:"Section heading"}]
//         a field can also be a table: {l:"Bugs",t:"table",rowLabel:"Bug",rows:2,cols:[{l:"Title",t:"short"},{l:"Steps",t:"long"}]}
// optional: title (small label above the question), hint (grey note), img (key of an embedded screenshot, see IMG),
//           after (text/bullets shown under the image), ai (description of the image for grading; not shown to students)
//           a field of type "dbdesign" gives the table builder + drawing board
const PRACTICAL = [
  {title:"HTTP Status Codes", q:"What is the difference between HTTP status code 500 and 400?", hint:"Answer clearly and briefly.", type:"long"},

  {title:"SQL", q:"You have a database table called Users that contains the following columns:\nUserID, UserName, Age, Email\n\nWrite an SQL query to retrieve all users whose age is greater than 25.", hint:"Write your SQL query below.", type:"code"},

  {title:"Database vs UI Validation", q:"You found that the UI shows an order status as \u201cCompleted\u201d, but the database shows \u201cPending\u201d.\nAs a tester, describe the steps you would take to investigate and verify this issue, and explain your final action after confirming the issue.", type:"fields",
    fields:[{l:"Steps to investigate and verify",t:"xl"},{l:"Final action after confirming the issue",t:"medium"}]},

  {title:"Java \u2013 Class vs Object", q:"What is the difference between a Class and an Object in Java? Explain with a simple example.", type:"fields",
    fields:[{l:"Difference between a Class and an Object",t:"medium"},{l:"Simple example (Java code)",t:"code"}]},

  {title:"Java \u2013 ArrayList vs Array", q:"What is the difference between an ArrayList and a normal Array in Java?", type:"fields",
    fields:[{l:"Normal Array",t:"long"},{l:"ArrayList",t:"long"}]},

  {title:"Automation \u2013 Locators", q:"What is a Locator? Why do we use locators in automation?", type:"fields",
    fields:[{l:"What is a locator?",t:"medium"},{l:"Why do we use locators in automation?",t:"medium"}]},

  {title:"Problem Solving", q:"You are given a range of numbers from 1 to N. Write pseudocode to count how many numbers are even.", hint:"Write your pseudocode below.", type:"code"},

  {title:"Database Design", q:"Please design a simple database to store information about employees and the products they order.\n\u2022 An employee can order more than one product.\n\u2022 A product can be ordered by several employees.\n\nRequirements:\n1. Draw the database tables and include the columns for each table.\n2. Identify the primary key (PK) and foreign key (FK) where applicable.\n3. Show the relationships between the tables.\n\nThe required information is:\n\u2022 Employee: Name, Address\n\u2022 Product: Product Name", hint:"Build your tables with the table builder, or draw a diagram in the \u201cDraw a diagram\u201d tab. You can use both.", type:"fields",
    fields:[{l:"Your database design",t:"dbdesign"}]},

  {title:"Case Study 1", q:"Read the following requirements and screenshot, and then write down the following:\n1) 2 requirements review issues (bugs in the requirement specifications).\n2) 8 test cases to test this application.\n3) 2 possible bugs that can be found in this application, in a bug report template.", img:"vacation",
    ai:"[Screenshot shown to the student: a 'Vacation Request Form' with a required 'Vacation Type' radio group (Casual, Scheduled, Complimentary), required 'Start Date' and 'End Date' fields with calendar icons, and a 'Submit Vacation' button.]",
    after:[{b:"This is a vacation system; from which employees submit vacation requests. This request has to be approved by the employee's manager. In case the manager rejects the request, he has to write a rejection reason."},
           {b:"There are two types of vacations; casual and scheduled days; every employee is entitled to 6 casual days and 12 scheduled days. Employees have to consume their 20 total vacation days throughout the year, because the vacations balance is reset on the first day in New Year."},
           {b:"Once the vacation request is approved, the requested days are deducted from the employee's vacation balance. There is a separate window from where the employees can track their balance."}],
    type:"fields",
    fields:[
      {l:"1) Requirements review issues (write 2 issues, each on a separate line)",t:"xl"},
      {l:"2) Test cases (steps and expected result for each)",t:"table",rowLabel:"Test case",rows:8,cols:[{l:"Test case",t:"long"}]},
      {l:"3) Bug report",t:"table",rowLabel:"Bug",rows:2,cols:[{l:"Title",t:"short"},{l:"Steps",t:"long"}]}
    ]},

  {title:"Case Study 2", q:"Please list all the issues that you find in this requirement.", hint:"Write each issue on a separate line.", img:"grade",
    ai:"[Screenshot shown to the student: '4) Student Grade Portal'. Left panel 'Select Criteria': Student ID text box, 'Current Year' dropdown (options 2028, 2029, 2020 visible), 'Degree' dropdown, 'Filter' button. Right panel 'Grade Report' table with columns Degree, GPA, Class Standing, Year and rows: A. Jones | 9.75 | 0+ | 2019 and B. Smith | 0.7 | N+ (partly garbled) | 2022.]",
    after:[{h:"Business Requirements Text"},
           "The \"Student Grade Portal\" provides university administrators with a quick tool to look up and filter student academic reports.",
           "Select Criteria: Users can filter reports using three fields: Student ID (text search), Current Year (Dropdown), and Degree (Dropdown). Clicking the \"Filter\" button fetches matching records.",
           {b:"The system requires at least one criteria field to be filled/selected before executing the filter. If all are empty, an error message is displayed."},
           "Grade Report Table: Displays the results matching the filters. The table shows the Student's Name (labeled under 'Degree' in the UI), GPA, Class Standing, and Year.",
           {b:"GPA must always be displayed as a decimal value calculated up to two decimal places."}],
    type:"xl"},

  {title:"Login Page", q:"Please list all the issues that you find in this login page.", hint:"Write each issue on a separate line.", img:"login", ai:"[Screenshot shown to the student: 'TECHZONE LOGIN PORTAL' page with a banner photo, 'Welcome to the TechZone Employee Portal', fields 'Email Address', 'Password', 'Confirm Password', a 'Remember my password' checkbox, the text 'Forgot your password?Sign up now!' on one line, and the footer 'TechZone Inc. 20224 \u00a9 All rights reserved'.]", type:"xl"},

  {title:"Case Study 4", q:"Please list 2 issues that you find in this page", img:"pricing",
    ai:"[Screenshot shown to the student: 'SaaS Platform Admin Portal - Billing / Pricing Setup', 'Select a Subscription Plan for your Team' with three cards: Starter $19/mo (Basic tools for small teams up to 5 users, button 'Get Started'); Professional 49$/mo with a POPULAR badge (Advanced analytics, unlimited projects, and priority support channels, rounded 'Get Pro' button); Enterprise $199/mo (Custom security, dedicated account manager, button 'Contact Sales').]",
    type:"fields",
    fields:[{l:"Issue 1",t:"medium"},{l:"Issue 2",t:"medium"}]},

  {title:"Version Control", q:"Your teammate wrote some automation code or a script on their machine, and you need to use it and build on top of it. Walk me through the professional, technical steps you would take to get that code and collaborate on it safely.", hint:"Write the steps in order, with the commands you would use.", type:"xl"},

  {title:"Logical Thinking", q:"Imagine we have an app, and we want to send a push notification to users to remind them to check out. But we don't want to annoy them. What logic would you write to make sure a user never receives more than 2 notifications a day, and never receives them back-to-back within less than 4 hours?", type:"fields",
    fields:[{l:"Your logic (pseudocode or steps)",t:"code"},{l:"Explanation and edge cases",t:"medium"}]}
];
/* =============================================== */

const $ = id => document.getElementById(id);
const app = $("app"), shield = $("shield");
const shuf = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]} return a };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LET = "ABCD";
const FLAG = "exam_done_v1";
let startedAt="", pStartedAt="", name="", idx=0, answers=[], ORDER=[], running=false, tick=null;
let stage="intro";            // intro | mcq | between | practical | end
let pIdx=0, pAns=[];

function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v) }catch(e){ return null } }

function send(rec){
  try{
    const body = JSON.stringify(rec);
    fetch(SHEET_URL,{method:"POST",mode:"no-cors",keepalive:body.length<60000,headers:{"Content-Type":"text/plain"},body});
  }catch(e){}
}

function intro(){
  if(ls(FLAG)) return finish("Exam already taken", "You have already taken this exam on this device.", true);
  app.innerHTML = `<div class="panel intro">
    <h1>${esc(EXAM_TITLE)}</h1>
    <p class="sub">${esc(SUBTITLE)}</p>
    <ul class="rules">
      <li>The exam has two parts: multiple-choice questions first, then practical questions.</li>
      <li class="hard">Do not leave the exam page. Switching tabs or apps, exiting full screen, or opening developer tools / Inspect ends the exam immediately.</li>
      <li>Copying, pasting and screenshots are blocked. Any attempt ends the exam.</li>
      <li>You can go back to review or change answers until you submit each part.</li>
      <li>Your result will not be shown after you submit.</li>
    </ul>
    <label class="f" for="nm">Full name</label>
    <input type="text" id="nm" placeholder="Type your full name" autocomplete="off" maxlength="80">
    <p class="err" id="er"></p>
    <button class="btn full" id="go">Start exam</button>
  </div>`;
  $("go").onclick = async () => {
    name = $("nm").value.trim();
    if(name.length < 3){ $("er").textContent = "Enter your full name to continue."; $("nm").focus(); return; }
    try{ await document.documentElement.requestFullscreen(); }catch(e){}
    ORDER = shuf(QUESTIONS.map((q,i)=>({qi:i, oi:shuf(q.o.map((_,k)=>k))})));
    idx = 0; answers = []; running = true; stage = "mcq"; startedAt = new Date().toISOString(); ls(FLAG,"1");
    if(MINUTES>0){
      const end = Date.now() + MINUTES*60000;
      tick = setInterval(()=>{ if(Date.now()>=end) submitMCQ("timeout"); }, 500);
    }
    render();
  };
}

/* ---------- Part 1: MCQ ---------- */
function render(){
  const O = ORDER[idx], Q = QUESTIONS[O.qi], sel = answers[idx], last = idx===QUESTIONS.length-1;
  app.innerHTML = `
  <div class="head"><div class="row"><span class="who">${esc(name)}</span></div></div>
  <p class="qn"></p>
  <h2 class="q">${esc(Q.q)}</h2>
  <div>${O.oi.map((k,p)=>`<button class="opt ${sel===k?'sel':''}" data-i="${k}"><span class="k">${LET[p]}</span><span>${esc(Q.o[k])}</span></button>`).join("")}</div>
  <div class="bottom"><div class="in">${idx>0?'<button class="btn ghost" id="bk">Back</button>':'<span></span>'}
  <button class="btn" id="nx" ${sel===undefined?'disabled':''}>${last?(PRACTICAL.length?'Submit MCQ Questions':'Submit'):'Next'}</button></div></div>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => { answers[idx] = +b.dataset.i; render(); });
  if($("bk")) $("bk").onclick = () => { idx--; render(); window.scrollTo(0,0); };
  $("nx").onclick = () => { if(last) submitMCQ("completed"); else { idx++; render(); window.scrollTo(0,0); } };
}

function submitMCQ(status){
  if(stage!=="mcq") return;
  clearInterval(tick);
  const ans = QUESTIONS.map(()=> "");
  ORDER.forEach((O,i)=>{ if(answers[i]!==undefined) ans[O.qi] = LET[answers[i]]; });
  send({kind:"mcq", name, status, answers:ans.join(","), startedAt});
  if(status==="terminated") return endExam("Exam ended","The exam was closed because you left the exam page. Your answers so far were recorded.", true);
  if(!PRACTICAL.length) return endExam("Exam submitted","Your answers have been recorded. You can close this page.");
  stage = "between"; renderBetween();
}

function renderBetween(){
  window.scrollTo(0,0);
  app.innerHTML = `<div class="panel end"><div class="ic">✓</div><h2>MCQ questions submitted</h2>
  <p>Your answers have been recorded.<br>Continue to the practical questions when you are ready.</p>
  <button class="btn" id="mv">Move to Practical Questions</button></div>`;
  $("mv").onclick = () => {
    stage = "practical"; pStartedAt = new Date().toISOString(); pIdx = 0;
    pAns = PRACTICAL.map(p => p.type==="fields" ? p.fields.map(f => f.t==="table" ? Array.from({length:f.rows},()=>f.cols.map(()=> "")) : f.t==="dbdesign" ? newDb() : "") : "");
    renderP();
  };
}

/* ---------- Part 2: practical ---------- */
function field(label, kind, val, onchange){
  const wrap = document.createDocumentFragment();
  if(label){ const l=document.createElement("label"); l.className="fl"; l.textContent=label; wrap.appendChild(l); }
  const el = document.createElement(kind==="short" ? "input" : "textarea");
  const isCode = kind==="code" || kind==="codesm";
  if(kind==="short") el.type="text";
  el.className = "ans " + kind + (isCode ? " code" : "");
  el.value = val; el.autocomplete="off"; el.spellcheck = !isCode;
  if(isCode){ el.setAttribute("autocapitalize","off"); el.setAttribute("autocorrect","off"); }
  el.addEventListener("input",()=>onchange(el.value));
  if(isCode) el.addEventListener("keydown",e=>{ if(e.key==="Tab"){ e.preventDefault(); const p=el.selectionStart; el.setRangeText("  ",p,el.selectionEnd,"end"); onchange(el.value); } });
  wrap.appendChild(el);
  return wrap;
}

function tableField(o, rows){
  const wrap = document.createDocumentFragment();
  const l=document.createElement("label"); l.className="fl"; l.textContent=o.l; wrap.appendChild(l);
  const box=document.createElement("div"); box.className="tbl";
  rows.forEach((row,r)=>{
    const tr=document.createElement("div"); tr.className="trow";
    const rl=document.createElement("div"); rl.className="rl"; rl.textContent=(o.rowLabel||"Row")+" "+(r+1); tr.appendChild(rl);
    o.cols.forEach((c,k)=>{
      if(o.cols.length>1){ const cl=document.createElement("label"); cl.className="cl"; cl.textContent=c.l; tr.appendChild(cl); }
      const el=document.createElement(c.t==="short" ? "input" : "textarea");
      if(c.t==="short") el.type="text";
      el.className="ans "+(c.t||"long"); el.value=row[k]; el.autocomplete="off"; el.spellcheck=true;
      el.addEventListener("input",()=>{ row[k]=el.value; });
      tr.appendChild(el);
    });
    box.appendChild(tr);
  });
  wrap.appendChild(box);
  return wrap;
}

/* ---------- helpers + database designer (tables / relationships / drawing) ---------- */
function el(tag, cls, txt){ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
function add(p, ...kids){ kids.forEach(k=>p.appendChild(k)); return p; }
function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); }
function mini(txt, fn, cls){ const b=el("button","mini"+(cls?" "+cls:""),txt); b.type="button"; b.onclick=fn; return b; }
const KEYS = ["","PK","FK","PK+FK"], REL = ["One-to-One","One-to-Many","Many-to-One","Many-to-Many"];

function newDb(){ return {tables:[{name:"",cols:[{n:"",k:"",ref:""},{n:"",k:"",ref:""}]}], rels:[], draw:""}; }

function dbText(st){
  const out=[];
  const tb=st.tables.filter(t=>t.name.trim()||t.cols.some(c=>c.n.trim()));
  if(tb.length){ out.push("[Tables]"); tb.forEach(t=>{ out.push("Table: "+(t.name.trim()||"(no name)")); t.cols.filter(c=>c.n.trim()).forEach(c=>out.push("  - "+c.n.trim()+(c.k?" ["+c.k+"]":"")+(c.ref&&c.ref.trim()&&/FK/.test(c.k)?" -> "+c.ref.trim():""))); }); }
  const rl=st.rels.filter(r=>r.a.trim()||r.b.trim());
  if(rl.length){ out.push("[Relationships]"); rl.forEach(r=>out.push(r.a.trim()+"  "+REL[r.t]+"  "+r.b.trim())); }
  if(st.draw) out.push("[Diagram drawn - see the attached image link]");
  return out.join("\n");
}

function dbField(o, st){
  const wrap=document.createDocumentFragment();
  if(o.l) add(wrap, el("label","fl",o.l));
  const root=el("div","dbd"), tabs=el("div","tabs"), pT=el("div"), pD=el("div");
  const bT=mini("Tables & relationships",()=>show("t"),"on"), bD=mini("Draw a diagram",()=>show("d"));
  function show(w){ pT.style.display=w==="t"?"block":"none"; pD.style.display=w==="d"?"block":"none"; bT.className="mini"+(w==="t"?" on":""); bD.className="mini"+(w==="d"?" on":""); }
  add(tabs,bT,bD);

  // ----- tables -----
  const tWrap=el("div"), rWrap=el("div");
  function paintTables(){
    clear(tWrap);
    st.tables.forEach((t,ti)=>{
      const card=el("div","tcard"), head=el("div","thead");
      const nm=el("input","ans"); nm.type="text"; nm.placeholder="Table name (e.g. Employee)"; nm.value=t.name; nm.autocomplete="off";
      nm.addEventListener("input",()=>{ t.name=nm.value; });
      add(head,nm, st.tables.length>1 ? mini("\u2715",()=>{ st.tables.splice(ti,1); paintTables(); },"x") : el("span"));
      add(card,head);
      t.cols.forEach((c,ci)=>{
        const row=el("div","crow");
        const cn=el("input","ans"); cn.type="text"; cn.placeholder="Column name"; cn.value=c.n; cn.autocomplete="off";
        cn.addEventListener("input",()=>{ c.n=cn.value; });
        const ref=el("input","ans ref"); ref.type="text"; ref.placeholder="References (e.g. Employee.EmployeeID)"; ref.value=c.ref; ref.autocomplete="off";
        ref.addEventListener("input",()=>{ c.ref=ref.value; });
        ref.style.display=/FK/.test(c.k)?"block":"none";
        const kb=mini(c.k||"Key",()=>{ c.k=KEYS[(KEYS.indexOf(c.k)+1)%KEYS.length]; kb.textContent=c.k||"Key"; kb.className="mini key"+(c.k?" on":""); ref.style.display=/FK/.test(c.k)?"block":"none"; },"key"+(c.k?" on":""));
        add(row,cn,kb, t.cols.length>1 ? mini("\u2715",()=>{ t.cols.splice(ci,1); paintTables(); },"x") : el("span"), ref);
        add(card,row);
      });
      add(card, mini("+ Add column",()=>{ t.cols.push({n:"",k:"",ref:""}); paintTables(); },"add"));
      add(tWrap,card);
    });
    add(tWrap, mini("+ Add table",()=>{ st.tables.push({name:"",cols:[{n:"",k:"",ref:""},{n:"",k:"",ref:""}]}); paintTables(); },"add big"));
  }
  function paintRels(){
    clear(rWrap);
    add(rWrap, el("div","rh","Relationships between the tables"));
    st.rels.forEach((r,ri)=>{
      const card=el("div","rrow");
      const a=el("input","ans"); a.type="text"; a.placeholder="Table A"; a.value=r.a; a.autocomplete="off"; a.addEventListener("input",()=>{ r.a=a.value; });
      const b=el("input","ans"); b.type="text"; b.placeholder="Table B"; b.value=r.b; b.autocomplete="off"; b.addEventListener("input",()=>{ r.b=b.value; });
      const tb=mini(REL[r.t]+"  (tap to change)",()=>{ r.t=(r.t+1)%4; tb.textContent=REL[r.t]+"  (tap to change)"; },"rel");
      add(card,a,tb,b,mini("\u2715",()=>{ st.rels.splice(ri,1); paintRels(); },"x"));
      add(rWrap,card);
    });
    add(rWrap, mini("+ Add relationship",()=>{ st.rels.push({a:"",t:1,b:""}); paintRels(); },"add"));
  }
  paintTables(); paintRels(); add(pT,tWrap,rWrap);

  // ----- drawing -----
  const cvw=el("div","cvw"), cv=document.createElement("canvas"); cv.width=1000; cv.height=620; cv.className="cv";
  const ctx=cv.getContext("2d");
  const blank=()=>{ ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height); };
  blank();
  if(st.draw){ const im=new Image(); im.onload=()=>ctx.drawImage(im,0,0); im.src=st.draw; }
  let tool="pen", color="#111111", drawing=false, start=null, last=null, snap=null; const hist=[];
  const save=()=>{ st.draw=cv.toDataURL("image/png"); };
  const push=()=>{ hist.push(ctx.getImageData(0,0,cv.width,cv.height)); if(hist.length>20) hist.shift(); };
  const pos=e=>{ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*cv.width/r.width, y:(e.clientY-r.top)*cv.height/r.height, cx:e.clientX-r.left, cy:e.clientY-r.top}; };
  function style(){ ctx.lineCap="round"; ctx.lineJoin="round"; ctx.lineWidth=tool==="eraser"?26:3; ctx.strokeStyle=tool==="eraser"?"#fff":color; }
  function shape(a,b){ ctx.putImageData(snap,0,0); style(); ctx.beginPath(); if(tool==="line"){ ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); } else { ctx.rect(a.x,a.y,b.x-a.x,b.y-a.y); } ctx.stroke(); }
  function textAt(p){
    const inp=el("input","ti"); inp.type="text"; inp.style.left=p.cx+"px"; inp.style.top=p.cy+"px"; inp.placeholder="Type, then Enter"; inp.autocomplete="off";
    let done=false;
    const fin=()=>{ if(done) return; done=true; const v=inp.value; if(inp.parentNode) inp.parentNode.removeChild(inp); if(v.trim()){ push(); ctx.fillStyle=color; ctx.font="26px Arial, sans-serif"; ctx.textBaseline="top"; ctx.fillText(v,p.x,p.y); save(); } };
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); fin(); } });
    inp.addEventListener("blur",fin);
    cvw.appendChild(inp); setTimeout(()=>inp.focus(),0);
  }
  cv.addEventListener("pointerdown",e=>{
    e.preventDefault(); const p=pos(e);
    if(tool==="text"){ textAt(p); return; }
    try{ cv.setPointerCapture(e.pointerId); }catch(x){}
    push(); drawing=true; start=p; last=p; snap=ctx.getImageData(0,0,cv.width,cv.height);
    if(tool==="pen"||tool==="eraser"){ style(); ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+.1,p.y+.1); ctx.stroke(); }
  });
  cv.addEventListener("pointermove",e=>{
    if(!drawing) return; e.preventDefault(); const p=pos(e);
    if(tool==="pen"||tool==="eraser"){ style(); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; }
    else shape(start,p);
  });
  const up=()=>{ if(!drawing) return; drawing=false; save(); };
  cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);
  add(cvw,cv);
  const tb=el("div","tb");
  const toolBtns={};
  [["pen","Pen"],["line","Line"],["box","Box"],["text","Text"],["eraser","Eraser"]].forEach(([k,n])=>{ toolBtns[k]=mini(n,()=>{ tool=k; Object.keys(toolBtns).forEach(x=>{ toolBtns[x].className="mini"+(x===tool?" on":""); }); },k==="pen"?"on":""); add(tb,toolBtns[k]); });
  [["#111111","Black"],["#1d4ed8","Blue"],["#c0392b","Red"]].forEach(([c,n])=>{ const s=mini("",()=>{ color=c; if(tool==="eraser"){ tool="pen"; Object.keys(toolBtns).forEach(x=>{ toolBtns[x].className="mini"+(x===tool?" on":""); }); } },"sw"); s.style.background=c; s.setAttribute("aria-label",n); add(tb,s); });
  add(tb, mini("Undo",()=>{ const h=hist.pop(); if(h){ ctx.putImageData(h,0,0); save(); } }), mini("Clear",()=>{ push(); blank(); st.draw=""; }));
  add(pD, el("p","hintp","Draw your tables as boxes, add their columns with the Text tool, and connect them with lines. Tip: use \u201cBox\u201d for tables and \u201cLine\u201d for relationships."), tb, cvw);

  show("t");
  add(root,tabs,pT,pD); add(wrap,root);
  return wrap;
}

function openShot(src){
  closeShot();
  const lb=document.createElement("div"); lb.id="lb";
  const x=document.createElement("button"); x.className="btn"; x.textContent="Close"; x.onclick=closeShot;
  const im=document.createElement("img"); im.src=src; im.draggable=false; im.alt="";
  lb.appendChild(x); lb.appendChild(im); document.body.appendChild(lb);
}
function closeShot(){ const l=document.getElementById("lb"); if(l) l.remove(); }

function afterHtml(Q){
  if(!Q.after) return "";
  let h="", inList=false;
  Q.after.forEach(x=>{
    if(x.b){ if(!inList){ h+='<ul class="ab">'; inList=true; } h+="<li>"+esc(x.b)+"</li>"; return; }
    if(inList){ h+="</ul>"; inList=false; }
    h += x.h ? '<h3 class="ah">'+esc(x.h)+"</h3>" : '<p class="ap">'+esc(x)+"</p>";
  });
  if(inList) h+="</ul>";
  return '<div class="after">'+h+"</div>";
}

function renderP(){
  const Q = PRACTICAL[pIdx], last = pIdx===PRACTICAL.length-1;
  app.innerHTML = `
  <div class="head"><div class="row"><span class="who">${esc(name)}</span><span class="tag">Practical</span></div></div>
  <p class="qn">${esc(Q.title||"")}</p>
  <h2 class="q">${esc(Q.q)}</h2>
  ${Q.hint?`<p class="hintp">${esc(Q.hint)}</p>`:''}
  ${Q.img?`<div class="shotwrap"><img class="shot" id="shot" alt="" draggable="false"><p class="zoomhint">Tap the image to enlarge it.</p></div>`:''}
  ${afterHtml(Q)}
  <div id="fld"></div>
  <div class="bottom"><div class="in">${pIdx>0?'<button class="btn ghost" id="bk">Back</button>':'<span></span>'}
  <button class="btn" id="nx">${last?'Submit Practical Questions':'Next'}</button></div></div>`;
  if(Q.img){ const im=$("shot"); im.src=IMG[Q.img]; im.onclick=()=>openShot(IMG[Q.img]); }
  const box = $("fld");
  if(Q.type==="fields"){
    Q.fields.forEach((f,j)=>{
      if(f.h){ const h=document.createElement("h3"); h.className="sec"; h.textContent=f.h; box.appendChild(h); return; }
      const o = typeof f==="string" ? {l:f,t:"short"} : f;
      if(o.t==="table"){ box.appendChild(tableField(o, pAns[pIdx][j])); return; }
      if(o.t==="dbdesign"){ box.appendChild(dbField(o, pAns[pIdx][j])); return; }
      box.appendChild(field(o.l, o.t||"short", pAns[pIdx][j], v=>{ pAns[pIdx][j]=v; }));
    });
  } else {
    box.appendChild(field("", Q.type||"long", pAns[pIdx], v=>{ pAns[pIdx]=v; }));
  }
  if($("bk")) $("bk").onclick = () => { pIdx--; renderP(); window.scrollTo(0,0); };
  $("nx").onclick = () => { if(last) submitPractical("completed"); else { pIdx++; renderP(); window.scrollTo(0,0); } };
}

function submitPractical(status){
  if(stage!=="practical" && stage!=="between") return;
  const out = PRACTICAL.map((p,i)=>{
    const v = pAns[i];
    if(v===undefined) return "";
    if(p.type==="fields") return p.fields.map((f,j)=>{ if(f.h) return "["+f.h+"]"; if(f.t==="dbdesign") return dbText(v[j]); if(f.t==="table") return "["+f.l+"]\n"+v[j].map((row,r)=>f.cols.map((c,k)=>f.rowLabel+" "+(r+1)+(f.cols.length>1?" - "+c.l:"")+": "+(row[k]||"")).join("\n")).join("\n"); const l=typeof f==="string"?f:f.l; return l+": "+(v[j]||""); }).join("\n");
    return v;
  });
  const drawings=[];
  PRACTICAL.forEach((p,i)=>{ if(p.type==="fields" && pAns[i]) p.fields.forEach((f,j)=>{ if(f.t==="dbdesign" && pAns[i][j] && pAns[i][j].draw) drawings.push({i, png:pAns[i][j].draw}); }); });
  send({kind:"practical", name, status, startedAt:pStartedAt, answers:out, drawings});
  if(status==="terminated") return endExam("Exam ended","The exam was closed because you left the exam page. Your answers so far were recorded.", true);
  endExam("Exam submitted","Your answers have been recorded. You can close this page.");
}

async function endExam(title,msg,bad){
  stage = "end"; running = false; clearInterval(tick);
  try{ if(document.fullscreenElement) await document.exitFullscreen(); }catch(e){}
  finish(title,msg,bad);
}

function finish(title,msg,bad){
  shield.style.display = "none"; closeShot();
  app.innerHTML = `<div class="panel end ${bad?'bad':''}"><div class="ic">${bad?'!':'✓'}</div><h2>${esc(title)}</h2><p>${esc(msg)}</p></div>`;
}
